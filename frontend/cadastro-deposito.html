<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro de depósito · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
</head>

<body data-area="cliente" data-nav2="MEUS PEDIDOS">
    <div id="hd"></div>
    <main class="auth">
        <section class="box">
            <h1>Cadastre seu depósito</h1>
            <p class="sub">Venda seus produtos através do DiskObra!</p>
            <form id="formDeposito" data-auth="login.html" novalidate>
                <label class="fld">
                    <span class="ic">🏪</span>
                    <input type="text" name="nomeLoja" placeholder="Digite o nome do depósito" aria-label="Digite o nome do depósito" required>
                </label>
                <label class="fld">
                    <span class="ic">@</span>
                    <input type="email" name="email" placeholder="Digite o e-mail da empresa" aria-label="Digite o e-mail da empresa" required>
                </label>
                <label class="fld">
                    <span class="ic">👤</span>
                    <input type="text" name="cnpj" placeholder="Digite o CNPJ da empresa" aria-label="Digite o CNPJ da empresa" inputmode="numeric" required>
                </label>
                <label class="fld">
                    <span class="ic">📞</span>
                    <input type="tel" name="nrTelefone" placeholder="Digite o número de telefone da empresa" aria-label="Digite o número de telefone da empresa">
                </label>
                <label class="fld">
                    <span class="ic">📍</span>
                    <input type="text" name="noEndereco" placeholder="Endereço (rua, número, bairro)" aria-label="Endereço">
                </label>
                <label class="fld">
                    <span class="ic">🏙</span>
                    <input type="text" name="noCidade" placeholder="Cidade" aria-label="Cidade">
                </label>
                <label class="fld">
                    <span class="ic">🗺</span>
                    <input type="text" name="sgUf" placeholder="UF (ex: SP)" aria-label="UF" maxlength="2">
                </label>
                <label class="fld">
                    <span class="ic">🔒</span>
                    <input type="password" name="senha" placeholder="Digite uma senha" aria-label="Digite uma senha" required>
                </label>
                <label class="fld">
                    <span class="ic">🔒</span>
                    <input type="password" name="senhaConfirma" placeholder="Digite a mesma senha novamente" aria-label="Digite a mesma senha novamente" required>
                </label>
                <p class="msg" role="alert"></p>
                <button class="btn-main" type="submit">CRIAR CONTA</button>
            </form>
            <p class="lnk">Já possui uma conta? <a href="login.html">Login</a></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
