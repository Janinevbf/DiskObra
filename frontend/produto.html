<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produto · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
    
</head>

<body data-area="cliente">
    <div id="hd"></div>
    <main class="det">
        <div>
            <div class="big" id="detImg">🛠️</div>
        </div>
        <div>
            <h1 id="detTitle">Carregando produto...</h1>
            <div class="stars" style="padding:0;font-size:44px">★★★★<i>★</i></div>
            <div class="row"><span class="price" id="detPrice"></span><button class="btn-or" data-add>Adicionar ao
                    carrinho</button><button class="fav det-fav" id="detFav" data-fav="" aria-label="Favoritar">♡</button></div>
            <div class="sec" id="detInfo"></div>
            <div class="sec"><b>Descrição:</b>Produto disponível no catálogo DiskObra. Consulte a loja para mais
                detalhes sobre especificações técnicas, garantia e prazo de entrega.</div>
            <div class="sec"><b>Avaliações:</b><span class="stars" style="padding:0">★★★★★</span><br>Produto de ótima
                qualidade e com bom custo-benefício para a sua obra.</div>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
