<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Perfil do depósito · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
</head>

<body data-area="deposito">
    <div id="hd"></div>
    <div class="dep">
        <h1>PERFIL DO DEPÓSITO</h1>
        <aside class="side" id="sidebar"></aside>
        <section class="pnl">
            <div class="fr">
                <label style="flex:2">Nome do depósito<input id="lojaNome"></label>
                <label class="store-logo-field" style="flex:2">Foto do logotipo
                    <div class="store-logo-controls">
                        <div class="store-logo-preview" id="lojaLogoPreview" hidden>
                            <img id="lojaLogoImagem" alt="Logotipo da loja">
                        </div>
                        <div class="store-logo-upload">
                            <input id="lojaLogoArquivo" type="file" accept="image/jpeg,image/png,image/webp"
                                style="display:none">
                            <button class="up" id="lojaLogoSelecionar" type="button"><img src="img/icons/upload.png"
                                    alt="Inserir imagem"> Inserir imagem</button>
                            <small>JPG, PNG ou WEBP. A imagem será otimizada antes do envio.</small>
                            <p class="store-message" id="lojaLogoMensagem" role="status" aria-live="polite"></p>
                        </div>
                    </div>
                </label>
            </div>
            <div class="fr">
                <label>CEP<input id="lojaCep" inputmode="numeric" maxlength="9" placeholder="00000-000"></label>
                <label style="flex:3">Endereço<input id="lojaEndereco"></label>
                <label>Número<input id="lojaNumero"></label>
            </div>
            <div class="fr">
                <label style="flex:2">Cidade<input id="lojaCidade"></label>
                <label>UF<input id="lojaUf" maxlength="2"></label>
            </div>
            <div class="fr">
                <label>Telefone<input id="lojaTelefone" type="tel"></label>
                <label style="flex:2">E-mail<input id="lojaEmail" type="email"></label>
            </div>
            <h2 style="font-size:22px;margin:24px 0 10px">Horário de funcionamento</h2>
            <div class="fr">
                <label>Abre em feriados
                    <select id="lojaAbreFeriados">
                        <option value="true">Sim</option>
                        <option value="false" selected>Não</option>
                    </select></label>
                <label>Abre
                    <input type="time" value="08:00" id="lojaAbre">
                </label>
                <label>Fecha
                    <input type="time" value="20:30" id="lojaFecha">
                </label>
                <div class="dias-funcionamento">
                    <span>Dias abertos (selecione os dias)</span>
                    <div class="dias-checkboxes">
                        <label><input type="checkbox" name="dias[]" value="seg"><span>Seg</span></label>
                        <label><input type="checkbox" name="dias[]" value="ter"><span>Ter</span></label>
                        <label><input type="checkbox" name="dias[]" value="qua"><span>Qua</span></label>
                        <label><input type="checkbox" name="dias[]" value="qui"><span>Qui</span></label>
                        <label><input type="checkbox" name="dias[]" value="sex"><span>Sex</span></label>
                        <label><input type="checkbox" name="dias[]" value="sab"><span>Sáb</span></label>
                        <label><input type="checkbox" name="dias[]" value="dom"><span>Dom</span></label>
                    </div>
                </div>
            </div>
            <button class="btn-gr sv" id="salvarPerfil" data-save>Salvar</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>

</html>
