<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-area="cliente">
    <div id="hd"></div>
    <main class="auth">
        <section class="box">
            <h1>Faça seu cadastro</h1>
            <p class="sub">Cadastre-se para ter acesso aos seus pedidos</p>
            <form data-auth="login.html" novalidate><label class="fld"><span class="ic">@</span><input type="email"
                        placeholder="Digite seu e-mail" aria-label="Digite seu e-mail"></label><label class="fld"><span
                        class="ic">👤</span><input type="text" placeholder="Digite seu CPF"
                        aria-label="Digite seu CPF"></label><label class="fld"><span class="ic">📞</span><input
                        type="tel" placeholder="Digite seu número de telefone"
                        aria-label="Digite seu número de telefone"></label><label class="fld"><span
                        class="ic">🔒</span><input type="password" placeholder="Digite sua senha"
                        aria-label="Digite sua senha"></label><label class="fld"><span class="ic">🔒</span><input
                        type="password" placeholder="Digite sua senha novamente"
                        aria-label="Digite sua senha novamente"></label>
                <p class="msg" role="alert"></p><button class="btn-main">CRIAR CONTA</button>
            </form>
            <p class="lnk">Já possui uma conta? <a href="login.html">Login</a></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
