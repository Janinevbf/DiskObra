<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Minha conta · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
</head>

<body data-area="cliente" data-page="conta">
    <div id="hd"></div>
    <main class="acc">
        <aside class="side">
            <h2>Minha Conta</h2>
            <a href="#dados" data-target="dados"> <img src="img/icons/profile.png" alt="Meus dados">Meus dados</a>
            <a href="#pedidos" data-target="pedidos"> <img src="img/icons/in-transit.png" alt="Meus pedidos">Meus
                pedidos</a>
            <a href="#enderecos" data-target="enderecos"> <img src="img/icons/address.png" alt="Endereços">Endereços</a>
            <a href="#favoritos" data-target="favoritos"> <img src="img/icons/favorite.png"
                    alt="Favoritos">Favoritos</a>
            <a href="carrinho.html"> <img src="img/icons/cart.png" alt="Meu carrinho"> Meu carrinho</a>
            <a href="depositos.html"> <img src="img/icons/factory.png" alt="Depósitos"> Depósitos</a>
            <a class="out" href="login.html" data-logout> <img src="img/icons/logout.png" alt="Sair da conta"> Sair da
                conta</a>
        </aside>
        <div>
            <section class="pnl account-profile" id="sec-dados" data-sec="dados">
                <div class="account-profile-head">
                    <div class="av" id="accAvatar" aria-hidden="true">--</div>
                    <div>
                        <h2 id="accNome">Carregando...</h2>
                        <p>Consulte e atualize seus dados pessoais.</p>
                    </div>
                </div>
                <form class="account-data-form" id="accDadosForm">
                    <label>Nome completo
                        <input id="accNomeCompleto" name="nome" type="text" maxlength="155" autocomplete="name" required>
                    </label>
                    <label>E-mail
                        <input id="accEmailConta" name="email" type="email" maxlength="150" autocomplete="email" required>
                    </label>
                    <label>CPF
                        <input id="accCpf" name="cpf" type="text" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00" required>
                    </label>
                    <label>Telefone
                        <input id="accTelefoneInput" name="telefone" type="tel" maxlength="20" autocomplete="tel" placeholder="(00) 00000-0000">
                    </label>
                    <div class="account-data-actions">
                        <button class="btn-or" id="salvarDados" type="submit">Salvar dados</button>
                        <p class="store-message" id="dadosMensagem" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </section>

            <section class="pnl" id="sec-pedidos" data-sec="pedidos" hidden>
                <div class="customer-orders-head">
                    <h2>Meus pedidos</h2>
                    <button class="btn-or" id="atualizarPedidosCliente" type="button">Atualizar pedidos</button>
                </div>
                <div id="accPedidos">
                    <p>Carregando pedidos...</p>
                </div>
            </section>

            <section class="pnl" id="sec-enderecos" data-sec="enderecos" hidden>
                <h2>Meus endereços</h2>
                <div id="accEnderecos">
                    <p>Carregando endereços...</p>
                </div>

                <h2 style="margin-top:26px">Adicionar / editar endereço</h2>
                <div class="addr-form">
                    <div class="fld"><span class="ic"><img src="img/icons/address.png" alt=""></span><input id="accCep"
                            inputmode="numeric" placeholder="CEP"></div>
                    <div class="fld"><span class="ic"><img src="img/icons/map.png" alt=""></span><input id="accEndereco"
                            placeholder="Endereço"></div>
                    <div class="fld"><span class="ic"><img src="img/icons/home.png" alt=""></span><input id="accNumero"
                            placeholder="Número"></div>
                    <div class="fld"><span class="ic"><img src="img/icons/city.png" alt=""></span><input id="accCidade"
                            placeholder="Cidade"></div>
                    <div class="fld"><span class="ic"><img src="img/icons/state.png" alt=""></span><input id="accUf"
                            maxlength="2" placeholder="UF"></div>
                    <button class="btn-or" id="salvarEndereco">Salvar endereço</button>
                </div>
            </section>

            <section class="pnl" id="sec-favoritos" data-sec="favoritos" hidden>
                <h2>Favoritos</h2>
                <div id="accFavoritos" class="grid fav-grid">
                    <p>Carregando favoritos...</p>
                </div>
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
