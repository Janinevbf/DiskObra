<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha · DiskObra</title>
    <link rel="stylesheet" href="css/recuperar-senha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
</head>
<body class="recuperar-senha">
    <div id="hd"></div>
    <main class="container">
        <section class="card-recuperacao">
            <h1>Redefinir senha</h1>
            <p class="descricao">
                Digite seu e-mail para receber o link de redefinição
            </p>
            <form id="formRecuperarSenha">
                <div class="campo-email">
                    <img src="img/icons/email.png" alt="Ícone de e-mail">
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>
                <button type="submit" class="btn-enviar">
                    Enviar link de redefinição
                </button>
            </form>
            <p class="voltar-login">
                Lembrou sua senha?
                <a href="login.html">Voltar para o login</a>
            </p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
