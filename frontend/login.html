<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login · DiskObra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-area="cliente">
    <div id="hd"></div>
    <main class="auth">
        <section class="box">
            <h1>Acesse sua conta</h1>
            <p class="sub">Faça login para gerenciar seus pedidos!</p>
            
            <!-- Adicionado id="formLogin" para o app.js reconhecer -->
            <form id="formLogin" data-auth="produtos.html" novalidate>
                <label class="fld">
                    <span class="ic">👤</span>
                    <input type="email" name="email" placeholder="Digite seu e-mail" aria-label="Digite seu e-mail" required>
                </label>
                
                <label class="fld">
                    <span class="ic">🔒</span>
                    <input type="password" name="senha" placeholder="Digite sua senha" aria-label="Digite sua senha" required>
                </label>
                
                <a class="forgot lnk" href="#">Esqueci minha senha</a>
                <p class="msg" role="alert"></p>
                <button class="btn-main" type="submit">ENTRAR</button>
            </form>
            
            <p class="lnk">Não possui cadastro? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
