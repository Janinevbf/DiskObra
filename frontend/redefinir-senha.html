<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha · DiskObra</title>
    <link rel="stylesheet" href="css/recuperar-senha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/LogotipoDiskObra.png">
</head>

<body>
    <div id="hd"></div>
    <main class="container">
        <section class="card-redefinir-senha">
            <h1>Redefinir senha</h1>
            <p class="info">
                Escolha uma nova senha para sua conta.
            </p>
            <form id="formRedefinirSenha">
                <div class="campo-senha">
                    <img src="img/icons/lock.png" alt="">
                    <input type="password" id="novaSenha" name="novaSenha" placeholder="Digite sua nova senha" required>
                </div>
                <button type="submit" class="btn-enviar-senha">
                    Redefinir senha
                </button>
            </form>
            <p class="voltar-login">
                Lembrou sua senha?
                <a href="login.html">Voltar para o login</a>
            </p>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
